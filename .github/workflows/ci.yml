name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Type-check, lint, formatting and tests (the same as the pre-commit hook), then a production build.
      - run: npm run check
      - run: npm run build
